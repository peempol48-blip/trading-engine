    content+='<text x="'+tx+'" y="'+(H-7)+'" fill="#94a7ae" font-size="11" text-anchor="'+(n===1?"middle":anchor)+'">'+dateLabel(dates[i])+'</text>';
  }
  if(bar){
    content+='<path d="M'+L+' '+y(0)+'H'+(W-R)+'" stroke="#71858c"/>';
    lines[0].values.forEach((v,i)=>{const bw=Math.max(1,Math.min(22,w/n*.72));content+='<rect x="'+(x(i)-bw/2)+'" y="'+Math.min(y(0),y(v))+'" width="'+bw+'" height="'+Math.max(1,Math.abs(y(v)-y(0)))+'" rx="1" fill="'+(v>=0?colors.green:colors.pink)+'"/>'})
  }else{
    for(const s of lines){
      let path="",move=true;
      s.values.forEach((v,i)=>{if(!Number.isFinite(v)){move=true;return}path+=(move?"M":"L")+x(i).toFixed(2)+","+y(v).toFixed(2);move=false});
      if(s.area)content+='<path d="'+path+'L'+x(n-1)+' '+(T+h)+'L'+x(0)+' '+(T+h)+'Z" fill="url(#shade'+id+')"/>';
      content+='<path d="'+path+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.area?2.1:1.6)+'" '+(s.dash?'stroke-dasharray="4 5"':'')+' stroke-linejoin="round"/>';
    }
  }
  el.innerHTML='<svg aria-hidden="true" viewBox="0 0 '+W+' '+H+'">'+content+'<line class="cross" opacity="0" y1="'+T+'" y2="'+(T+h)+'" stroke="#bfcdcf" stroke-dasharray="3 3"/></svg><div class="tip" role="status"></div>';
  const cross=el.querySelector(".cross"),tip=el.querySelector(".tip");let pointer=-1;
  function show(i){pointer=Math.max(0,Math.min(n-1,i));const cx=x(pointer);cross.setAttribute("x1",cx);cross.setAttribute("x2",cx);cross.setAttribute("opacity",".8");tip.textContent=dateLabel(dates[pointer],true)+"\n"+lines.map(s=>s.name+"  "+(s.values[pointer]==null?"—":usd(s.values[pointer]))).join("\n");tip.style.display="block";tip.style.top="3px";tip.style.left=Math.max(1,Math.min(W-tip.offsetWidth-2,cx+12))+"px"}
  function hide(){tip.style.display="none";cross.setAttribute("opacity","0")}
  el.onpointermove=e=>{const r=(e.clientX-el.getBoundingClientRect().left-L)/w;show(bar?Math.floor(r*n):Math.round(r*(n-1)))};
  el.onpointerleave=hide;el.onblur=hide;el.onkeydown=e=>{if(["ArrowRight","ArrowLeft","Home","End"].includes(e.key)){e.preventDefault();show(e.key==="Home"?0:e.key==="End"?n-1:pointer+(e.key==="ArrowRight"?1:-1))}};
}
function render(){
  const period=$("period").value,demo=period==="demo";current=DATA[period];$("model").disabled=demo;chosen=demo?"sma":lastResearchModel;$("model").value=chosen;model=current.models[chosen];
  const ds=current.dates,end=model.equity.at(-1),pnl=end-100000,bench=!demo&&chosen!=="hold";
  $("range").textContent=dateLabel(ds[0],true)+" – "+dateLabel(ds.at(-1),true)+"   ·   "+num(ds.length)+" trading sessions";
  const cards=[["Starting cash",usd(100000),"เงินทุนตั้งต้น",""],["Ending value",usd(end),"มูลค่าพอร์ตสิ้นงวด",pnl>=0?"green":"red"],["Total return",pct(pnl/100000),"ผลตอบแทนตลอดช่วง",pnl>=0?"green":"red"],["Max drawdown",pct(model.dd),"จากจุดสูงสุดของพอร์ต","red"],["Executed fills",num(model.fills.length),"คำสั่งที่จับคู่แล้ว",""]];
  document.querySelector(".kpis").innerHTML=cards.map(c=>'<div class="kpi"><small>'+c[0]+'</small><strong class="'+c[3]+'">'+c[1]+'</strong><p>'+c[2]+'</p></div>').join("");
  const eq=[{name:names[chosen],color:colors.green,values:model.equity,area:true}];if(bench)eq.push({name:names.hold,color:colors.grey,values:current.models.hold.equity,dash:true});
  $("eqlegend").innerHTML=eq.map(s=>key(s.name,s.color,s.dash)).join("")+(model.sharpe!==null?'<span class="chip">Sharpe '+model.sharpe.toFixed(3)+'</span>':'');
  graph("eq",ds,eq);
  const px=["AAPL","SMA 5","SMA 20"].map((name,i)=>({name,color:[colors.blue,colors.green,colors.gold][i],values:current.price.map(row=>row[i])}));
  $("pxlegend").innerHTML=px.map(s=>key(s.name,s.color)).join("");$("close").textContent=usd(current.price.at(-1)[0]);graph("px",ds,px);
  $("txlegend").innerHTML=key("ขาย · เงินเข้า",colors.green)+key("ซื้อ · เงินออก",colors.pink);
  graph("tx",model.fills.map(f=>ds[f[0]]),[{name:"Net flow",values:model.fills.map(f=>-f[1]*f[2]-f[3])}],true);
  $("method").textContent=(demo?"Demo 60 bars · ซื้อขายที่ราคาปิดของแท่งสัญญาณ":"Research backtest · ส่งคำสั่งหลังปิดตลาด ซื้อขายที่ราคาเปิดวันถัดไป")+" · กระแสเงินสดรายคำสั่งหักค่าคอมมิชชันแล้ว · ต้นทุนรวม "+usd(model.cost);
}
$("model").onchange=()=>{lastResearchModel=$("model").value;render()};$("period").onchange=render;
$("export").onclick=()=>{const fills=new Map(model.fills.map(f=>[f[0],f])),rows=["date,equity_usd,close_usd,sma5,sma20,signed_shares,fill_price_usd,commission_usd,trade_cash_flow_usd"];
  current.dates.forEach((d,i)=>{const f=fills.get(i);rows.push([d,model.equity[i],...current.price[i],f?.[1]??0,f?.[2]??"",f?.[3]??0,f?-f[1]*f[2]-f[3]:0].join(","))});
  const a=document.createElement("a"),url=URL.createObjectURL(new Blob([rows.join("\r\n")],{type:"text/csv"}));a.href=url;a.download="AAPL-"+$("period").value+"-"+chosen+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
let redraw;window.addEventListener("resize",()=>{cancelAnimationFrame(redraw);redraw=requestAnimationFrame(render)});render();
</script></body></html>
